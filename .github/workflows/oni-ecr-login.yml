name: ONI Test - amazon-ecr-login (melhor cenario Gove)

# Simula o melhor cenario: job ecr-public-auth usa a action oficial
# aws-actions/amazon-ecr-login (registry-type: public, mask-password: false)
# e expoe user/senha como output. Os 4 deploys paralelos (fieis ao Gove)
# usam isso em container.credentials, mantendo o container: intacto.

on:
  workflow_dispatch: {}

env:
  REGION: us-east-1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "build iniciou $(date -u +%T)"; sleep 45; echo "build fim $(date -u +%T)"

  ecr-public-auth:
    runs-on: ubuntu-latest
    needs: [build]
    outputs:
      docker_username: ${{ steps.login.outputs.docker_username_public_ecr_aws }}
      docker_password: ${{ steps.login.outputs.docker_password_public_ecr_aws }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}
      - name: Login to Amazon ECR Public
        id: login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
          mask-password: 'false'

  deploy-prod-api:
    needs: [build, ecr-public-auth]
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/dnxbrasil/oni:3.6.3
      credentials:
        username: ${{ needs.ecr-public-auth.outputs.docker_username }}
        password: ${{ needs.ecr-public-auth.outputs.docker_password }}
    steps:
      - run: echo "deploy-prod-api AUTENTICADO ok $(date -u +%T)"

  deploy-prod-workers:
    needs: [build, ecr-public-auth]
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/dnxbrasil/oni:3.6.3
      credentials:
        username: ${{ needs.ecr-public-auth.outputs.docker_username }}
        password: ${{ needs.ecr-public-auth.outputs.docker_password }}
    steps:
      - run: echo "deploy-prod-workers AUTENTICADO ok $(date -u +%T)"

  deploy-prod-admin:
    needs: [build, ecr-public-auth]
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/dnxbrasil/oni:3.6.3
      credentials:
        username: ${{ needs.ecr-public-auth.outputs.docker_username }}
        password: ${{ needs.ecr-public-auth.outputs.docker_password }}
    steps:
      - run: echo "deploy-prod-admin AUTENTICADO ok $(date -u +%T)"

  deploy-prod-api-vpn:
    needs: [build, ecr-public-auth]
    runs-on: ubuntu-latest
    container:
      image: public.ecr.aws/dnxbrasil/oni:3.6.3
      credentials:
        username: ${{ needs.ecr-public-auth.outputs.docker_username }}
        password: ${{ needs.ecr-public-auth.outputs.docker_password }}
    steps:
      - run: echo "deploy-prod-api-vpn AUTENTICADO ok $(date -u +%T)"
